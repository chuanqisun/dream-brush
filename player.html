<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>" />
    <title>Dream Brush</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        background-color: black;
        height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      video {
        max-height: 100%;
        min-height: 0;
        min-width: 0;
        object-fit: contain;
        aspect-ratio: 9 / 16;
      }

      .flipped video {
        transform: scaleX(-1);
      }

      .app-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;

        &:not(:hover, :focus) {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <button id="flip-toggle">Flip: Off</button>
    </header>

    <video id="videoPlayer" controls playsinline>
      <source src="./src/videos/full-walkthrough.webm" type="video/webm" />
      <track label="English" kind="subtitles" srclang="en" src="./src/videos/full-walkthrough.vtt" default />
      Your browser does not support the video tag.
    </video>

    <script type="module" src="./src/player.ts"></script>
  </body>
</html>
